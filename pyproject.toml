[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-control-plane"
version = "0.1.0"
description = "Governed certificate monitoring reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crypto-control-plane = "crypto_control_plane.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
