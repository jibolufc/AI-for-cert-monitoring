[package]
name = "kex-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Loopback-only TLS lab probe that records the negotiated key-exchange group"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1"

[profile.release]
panic = "abort"
